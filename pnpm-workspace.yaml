ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
packages:
  - .
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0

catalogs:
  runtime:
    "@actions/core": 3.0.1

  dev:
    "@rspack/cli": 2.3.1
    "@rspack/core": 2.3.1
    oxfmt: 0.76.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2006
    typescript: 7.0.2

  types:
    "@types/node": 26.6.6
